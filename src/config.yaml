# Demo copy of the EPCMst website, used to show the Content Operations hub
# publishing articles end to end. Not the real site (that is epcmst.com),
# so search engines are asked not to index it.
site:
  name: EPCMst Technical Services (demo)
  site: 'https://epcmst-demo-site.vercel.app'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: EPCMst Technical Services (demo site)
    template: '%s | EPCMst Resources (demo)'
  description: 'Demo copy of the EPCMst website, used to show articles published from the EPCMst Content Operations hub. The real site is epcmst.com.'
  robots:
    index: false
    follow: false
  openGraph:
    site_name: EPCMst Technical Services (demo)
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 12

    post:
      isEnabled: true
      permalink: '/resources/%slug%'
      robots:
        index: false

    list:
      isEnabled: true
      pathname: 'resources'
      robots:
        index: false

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
